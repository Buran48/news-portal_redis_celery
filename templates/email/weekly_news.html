{% load custom_filters %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>новые статьи за неделю</title>
</head>
<body>
    <p>на прошлой неделе в категории <strong>{{ category }}</strong> добавили новые статьи:</p>

    <ul>
    {% for post in posts %}
        <li>
            <strong>{{ post.title|censor }}</strong><br>
            {{ post.created_at|date:'d.m.Y' }}<br>
            <a href="http://127.0.0.1:8000{% url 'article_detail' post.id %}">
                посмотреть
            </a>
        </li>
    {% endfor %}
    </ul>

</body>
</html>
